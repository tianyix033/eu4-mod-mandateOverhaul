l_english:
 mo_claim_mandate_of_heaven_title:0 "Proclaim the Mandate of Heaven"
 mo_claim_mandate_of_heaven_desc:0 "Beijing, Nanjing and Chang'an answer to us, and the realm between them is ours in fact if not yet in name. Heaven does not confer its mandate on a claimant; it recognises a ruler. Let the ceremonies be prepared, the calendar reissued, and the ancestral rites performed in the proper order - and let anyone who disputes it explain which of the three capitals he holds."
