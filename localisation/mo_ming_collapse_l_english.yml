l_english:
 mo_ming.1.t:0 "The Court Must Move"
 mo_ming.1.d:0 "The north is lost. Rebel banners fly over provinces our grandfathers governed, and the roads out of the capital carry more refugees each week than grain carts in. The ministers are divided. Some say the dynasty is the capital and to leave it is to end it. Others say a court in exile is still a court, and a court in a burning city is nothing at all. The Son of Heaven must choose where the Ming will make its stand."
 mo_ming.1.a:0 "South, to Nanjing. The dynasty began there."
 mo_ming.1.b:0 "West, to Chengdu, behind the passes."
 mo_ming.1.c:0 "No emperor of ours has ever fled. We remain."
 mo_ming.2.t:0 "The Capital Has Fallen"
 mo_ming.2.d:0 "The gates were opened from within. By the time the rebels reached the inner city there was no garrison left to speak of, and no one had seen the Emperor since the night watch. They found him at dawn on the hill behind the palace, beneath a locust tree, where he had gone alone. What remains of the court is scattered between three provinces and four claimants, and every one of them says Heaven has spoken."
 mo_ming.2.a:0 "Then let the mourning be brief."
 mo_abandoned_the_capital:0 "Abandoned the Capital"
 mo_capital_abandoned_province:0 "Written Off by the Court"
 mo_refuge_of_the_court:0 "Refuge of the Court"
 mo_the_emperor_stands:0 "The Emperor Stands"
 mo_internal_struggles:0 "Internal Struggles"
