l_english:
 mo_feudatory.1.t:0 "The Question of the South"
 mo_feudatory.1.d:0 "The south is taken, and it was not our banners that took most of it. Chinese generals opened the passes, Chinese garrisons changed their coats, and Chinese magistrates kept collecting the grain tax without a day's interruption. They are now asking, politely and in the proper forms, what their reward is to be. We have not the men to hold Yunnan and Guangdong and Fujian ourselves - not while the north still needs watching. The alternative is to give three subjects what amounts to three kingdoms, and hope they remember who gave them."
 mo_feudatory.1.a:0 "Let them hold what they won, in our name."
 mo_feudatory.1.b:0 "Send them home. The south will be governed, not farmed."
 mo_feudatory.2.t:0 "The Edict of Abolition"
 mo_feudatory.2.d:0 "The edict arrived this morning, sealed and courteous. The feudatories are to be dissolved; we are to retire to the capital with honours, a pension and a house. Our officers are reading it over each other's shoulders in the courtyard and have stopped pretending to be calm. Whatever else is true, the men who hold the passes are ours and not his, and he has chosen to say this in writing while the memory of who took the south for him is still fresh."
 mo_feudatory.2.a:0 "Drive out the Manchu. The south rises tonight."
 mo_feudatory.2.b:0 "We will go to the capital, and we will go quietly."
 mo_abolish_the_feudatories_title:0 "Abolish the Feudatories"
 mo_abolish_the_feudatories_desc:0 "Three princes hold the south in our name, keep their own armies, collect their own revenues and answer our envoys when it suits them. Every year the arrangement lasts it becomes harder to end. Ending it will very likely mean war - but war now, while they are old men and the treasury is full, rather than war later against their sons."
 mo_the_prince_who_turned:0 "The Prince Who Turned"
 mo_resentful_of_the_conquest:0 "Resentful of the Conquest"
