l_english:
 mo_dongning.1.t:0 "The Fate of Taiwan"
 mo_dongning.1.d:0 "The mainland is gone. The last loyal garrison surrendered its walls months ago, and a new dynasty sits in the capital receiving envoys who once knelt to ours. We hold this island, a fleet no one in these seas can match, and a court that still issues edicts in the name of an emperor who is dead. The question the council will not say aloud is what we are now: a government in exile, a client waiting to be recognised, or simply the largest pirate fleet in the world."
 mo_dongning.1.a:0 "The Ming will be restored. We are its last soldiers."
 mo_dongning.1.b:0 "Send envoys. We will bend the knee and keep the island."
 mo_dongning.1.c:0 "We began as sea lords. We can end as them."
 mo_dongning.1.e:0 "This island is too small to beat the Qing from. We will take what we need in the southern seas, and come back for China."
 mo_dongning.2.t:0 "The Envoys from Taiwan"
 mo_dongning.2.d:0 "A ship has come from the island under a flag of truce. The Zheng offer submission - tribute, recognition, the proper forms - and ask in return to keep what they hold. The ministers point out that the fleet which ruined our coasts for twenty years would become ours. The censors point out that these are the men who called us usurpers, and that an empire which buys its enemies has admitted it cannot beat them."
 mo_dongning.2.a:0 "Accept. A tributary at sea is worth a rebel on land."
 mo_dongning.2.b:0 "Refuse. We will not sleep in a bed another man has made."
